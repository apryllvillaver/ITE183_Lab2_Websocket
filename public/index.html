<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSL WebSocket Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f4f6f8;
            color: #17212b;
            font-family: Arial, Helvetica, sans-serif;
        }

        .chat-card {
            width: min(680px, 100%);
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #dce2e8;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(23, 33, 43, 0.08);
        }

        header {
            padding: 26px 28px 22px;
            border-bottom: 1px solid #e6eaee;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #167d74;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .subtitle {
            margin: 8px 0 0;
            color: #5d6975;
            line-height: 1.5;
        }

        .chat-area {
            padding: 24px 28px 28px;
        }

        #status {
            margin-bottom: 16px;
            padding: 11px 13px;
            border-radius: 7px;
            background: #eef1f4;
            color: #48545f;
            font-size: 14px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        #status.connected {
            background: #dff4e8;
            color: #17653c;
        }

        #status.disconnected {
            background: #fbe2e2;
            color: #8b2e2e;
        }

        #controls {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        #msgInput {
            flex: 1;
            min-width: 0;
            padding: 11px 12px;
            border: 1px solid #bfc8d1;
            border-radius: 7px;
            font-size: 15px;
        }

        #msgInput:focus {
            border-color: #167d74;
            outline: 3px solid rgba(22, 125, 116, 0.12);
        }

        #sendBtn {
            padding: 11px 20px;
            border: 0;
            border-radius: 7px;
            background: #167d74;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        #sendBtn:disabled {
            background: #aab3bb;
            cursor: not-allowed;
        }

        #log {
            height: 260px;
            overflow-y: auto;
            padding: 14px;
            border: 1px solid #d7dde3;
            border-radius: 8px;
            background: #fafbfc;
            font-family: Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .sent {
            color: #185fb0;
        }

        .received {
            color: #187944;
        }

        .system {
            color: #6c7781;
            font-style: italic;
        }

        .error {
            color: #a12d2d;
        }

        @media (max-width: 520px) {
            body {
                padding: 12px;
            }

            header,
            .chat-area {
                padding-left: 18px;
                padding-right: 18px;
            }

            #controls {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main class="chat-card">
        <header>
            <p class="eyebrow">ITE183 / Laboratory 2</p>
            <h1>BSL WebSocket Chat</h1>
            <p class="subtitle">
                Open this page in two browser tabs to test real-time message broadcasting.
            </p>
        </header>

        <section class="chat-area">
            <div id="status">Connecting to the server...</div>

            <div id="controls">
                <input
                    type="text"
                    id="msgInput"
                    placeholder="Enter a message..."
                    aria-label="Chat message"
                    disabled
                >
                <button id="sendBtn" disabled>Send</button>
            </div>

            <div id="log" aria-live="polite"></div>
        </section>
    </main>

    <script>
        // Codespaces uses HTTPS, so its WebSocket connection must use WSS.
        // Local HTTP access continues to use WS.
        const wsProtocol =
            window.location.protocol === "https:" ? "wss:" : "ws:";

        const wsUrl = `${wsProtocol}//${window.location.host}`;
        const socket = new WebSocket(wsUrl);

        const statusDiv = document.getElementById("status");
        const logDiv = document.getElementById("log");
        const msgInput = document.getElementById("msgInput");
        const sendBtn = document.getElementById("sendBtn");

        function appendLog(text, className) {
            const entry = document.createElement("div");
            entry.className = className;
            entry.textContent = text;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        socket.onopen = function () {
            statusDiv.textContent = "Connected to " + wsUrl;
            statusDiv.className = "connected";
            msgInput.disabled = false;
            sendBtn.disabled = false;
            msgInput.focus();

            appendLog(
                "[System] Handshake completed. WebSocket is ready.",
                "system"
            );
        };

        socket.onmessage = function (event) {
            appendLog("[Server] " + event.data, "received");
        };

        socket.onclose = function () {
            statusDiv.textContent = "Disconnected from the server";
            statusDiv.className = "disconnected";
            msgInput.disabled = true;
            sendBtn.disabled = true;

            appendLog(
                "[System] The WebSocket connection was closed.",
                "system"
            );
        };

        socket.onerror = function () {
            appendLog(
                "[Error] A WebSocket connection error occurred.",
                "error"
            );
        };

        function sendMessage() {
            const text = msgInput.value.trim();

            if (
                text.length > 0 &&
                socket.readyState === WebSocket.OPEN
            ) {
                socket.send(text);
                appendLog("[You] " + text, "sent");
                msgInput.value = "";
                msgInput.focus();
            }
        }

        sendBtn.addEventListener("click", sendMessage);

        msgInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
