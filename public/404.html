<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f4f6f8;
            color: #17212b;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            max-width: 520px;
            padding: 42px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #dce2e8;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(23, 33, 43, 0.08);
        }

        .code {
            margin: 0;
            color: #167d74;
            font-size: 64px;
            font-weight: bold;
        }

        h1 {
            margin: 8px 0 12px;
        }

        p {
            margin: 0 0 22px;
            color: #5d6975;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 7px;
            background: #167d74;
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main>
        <p class="code">404</p>
        <h1>Page Not Found</h1>
        <p>
            The requested route is not available on this WebSocket server.
        </p>
        <a href="/">Return to the chat</a>
    </main>
</body>
</html>
